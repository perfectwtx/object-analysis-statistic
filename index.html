<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>对象分析统计 · Object Analyzer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.svg" sizes="any" />
    <meta name="theme-color" content="#1c1d1a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('themeMode') || localStorage.getItem('oa-theme');
          var theme;
          if (mode === 'light' || mode === 'dark' || mode === 'eyecare') {
            theme = mode;
          } else {
            var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = dark ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
          var loc = localStorage.getItem('oa-locale');
          if (loc === 'en') document.documentElement.lang = 'en';
          else document.documentElement.lang = 'zh-CN';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
